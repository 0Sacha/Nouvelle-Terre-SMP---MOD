// Build Gradle pour le mod NouvelleTerreBridge (Fabric 1.21.1)
plugins {
	id 'fabric-loom' version '1.10.5'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://maven.terraformersmc.com/releases" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// modCompileOnly "com.terraformersmc:modmenu:7.2.2" // Serveur maven.terraformersmc.com down - réactiver quand disponible

	// HTTP via java.net.http.HttpClient (JDK intégré - aucune dépendance externe)
	// Cadmus n'a pas de build 1.21.1 à ce jour : intégration par réflexion suspendue
	// (voir NouvelleTerreBridge, recherche de FabricLoader.isModLoaded("cadmus")).
}

processResources {
	inputs.property "version", project.version
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Minecraft 1.21.1 exige Java 21, quel que soit le loader. La toolchain le
	// fait récupérer par Gradle plutôt que de dépendre du JDK du poste (ici : 17).
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

tasks.named('remapJar') {
	doFirst {
		delete fileTree(dir: layout.buildDirectory.dir('libs').get().asFile, include: '*.jar')
	}
}

// Supprime les anciens jars de dev (build/devlibs) avant chaque build
tasks.named('jar') {
	doFirst {
		delete fileTree(dir: layout.buildDirectory.dir('devlibs').get().asFile, include: '*.jar')
	}
}
