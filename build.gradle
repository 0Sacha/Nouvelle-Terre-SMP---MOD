// Build Gradle pour le mod NouvelleTerreBridge (portage natif NeoForge 1.21.1)
plugins {
	id 'net.neoforged.moddev' version '2.0.147'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

neoForge {
	version = project.neoforge_version

	runs {
		client {
			client()
		}
		server {
			server()
		}
	}

	mods {
		"nouvelle_terre_bridge" {
			sourceSet sourceSets.main
		}
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// HTTP via java.net.http.HttpClient (JDK intégré - aucune dépendance externe)
	// Cadmus n'a pas de build 1.21.1 à ce jour : intégration par réflexion suspendue
	// (voir NouvelleTerreBridge, recherche de ModList.get().isLoaded("cadmus")).
}

processResources {
	inputs.property "version", project.version
	filteringCharset "UTF-8"

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 21
}

java {
	// Minecraft 1.21.1 exige Java 21, quel que soit le loader. La toolchain le
	// fait récupérer par Gradle plutôt que de dépendre du JDK du poste.
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

jar {
	// Purge les anciens JAR : un reliquat d'un build précédent (autre version ou
	// autre qualificatif +neoforge.N) s'y retrouverait sinon.
	doFirst {
		delete fileTree(dir: layout.buildDirectory.dir('libs').get().asFile, include: '*.jar')
	}

	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
