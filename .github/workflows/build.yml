name: Compiler & Publier NouvelleTerreBridge

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compiler le mod
        uses: gradle/actions/setup-gradle@v3

      - run: ./gradlew build --no-daemon

      - name: Lire la version du mod
        id: version
        run: |
          VERSION=$(grep '^mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION-$SHA" >> $GITHUB_OUTPUT

      # La description de la release est le changelog de la version (changelogs/<version>.md),
      # que le bot Discord relit ensuite pour /changelog. Voir changelogs/README.md.
      - name: Préparer la description de la release
        run: |
          FICHIER="changelogs/${{ steps.version.outputs.version }}.md"
          if [ -f "$FICHIER" ]; then
            cp "$FICHIER" notes-release.md
          else
            echo "::warning::Pas de $FICHIER — /changelog ne pourra pas publier cette version."
            printf 'Build automatique depuis le commit `%s`.
' "${{ steps.version.outputs.sha }}" > notes-release.md
          fi

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "NouvelleTerreBridge ${{ steps.version.outputs.version }} (${{ steps.version.outputs.sha }})"
          body_path: notes-release.md
          files: |
            build/libs/nouvelle-terre-bridge-${{ steps.version.outputs.version }}.jar
          make_latest: true

      - name: Mettre à jour le mod sur le serveur
        run: |
          sudo apt-get install -y sshpass
          JAR="nouvelle-terre-bridge-${{ steps.version.outputs.version }}.jar"
          sshpass -p "${{ secrets.SFTP_PASSWORD }}" sftp -P 2022 -o StrictHostKeyChecking=no yellox605.30551e80@7017.mystrator.com << EOF
          cd /mods
          rm nouvelle-terre-bridge-*.jar
          put build/libs/$JAR /mods/$JAR
          bye
          EOF

      - name: Notifier Discord
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "🔧 Nouveau mod déployé",
                "description": "**NouvelleTerreBridge `${{ steps.version.outputs.version }}`** est prêt sur le serveur.\n\n➡️ Redémarre le serveur pour appliquer la mise à jour.",
                "color": 16753920
              }]
            }'
