# Propriétés Gradle pour NouvelleTerreBridge (portage natif NeoForge)
# moddev est plus gourmand que Loom : 2 Go ne suffisent pas.
org.gradle.jvmargs=-Xmx3G

# NeoForge
minecraft_version=1.21.1
neoforge_version=21.1.250

# Mod
# +neoforge.N : qualificatif de build pour distinguer ce JAR natif du JAR Fabric
# 2.0.0 pendant les tests en parallèle des deux loaders. À retirer si/quand le
# natif remplace Connector pour de bon.
mod_version=2.0.0+neoforge.6
maven_group=com.nouvelleterrebridge
archives_base_name=nouvelle-terre-bridge

# Cadmus n'a pas de build 1.21.1 à ce jour — intégration par réflexion suspendue,
# à réintégrer si un build sort ou si un remplaçant est choisi.
